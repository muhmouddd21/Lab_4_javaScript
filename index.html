<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab_4</title>
    <link rel="stylesheet" href="./css/master.css">
</head>
<body>
    <div class="form-1">
        <form action="" >
            <button class="next" onclick="nextPhoto()" type="button">next</button>
            <button class="prev"  type="button" onclick="prevPhoto()">Previous</button>
            <button type="button" onclick="slide()">Slide Show</button>
            <button class="stop" type="button">Stop</button>
        </form>
    </div>

    <div class="images">
        <img id="img-1" class="now" src="./images/blue-clouds-day-fluffy-53594.jpeg" alt="">
        <img id="img-2"src="./images/images.jpeg" alt="">
        <img id="img-3"src="./images/istockphoto-1494319207-612x612.jpg" alt="">
    </div>

    <div class="question-2">
        <form action="" onsubmit="add(event)">
            <div class="multi-choice">
                <label>Department</label>
                <input type="radio" name="department" id="sd" value="SD"> <label for="sd">SD</label>
                <input type="radio" name="department" id="os" value="OS"> <label for="os">OS</label>
                <input type="radio" name="department" id="el" value="EL" checked> <label for="el">EL</label>
            </div>
            <div class="data">
                <label for="studentName">studentName</label>
                <input type="text" name="studentName" id="">
                <label for="studentGrade">studentGrade</label>
                <input type="text" name="studentGrade" id="">
                <span id="errorMassage"></span>

            </div>
            <div class="adding">
                <button type="submit">submit</button>
            </div>
            <div class="control-group">
                <label for="sort">Sort</label>
                <select id="sort" name="sort">
                  <option value="name" selected>Name</option>
                  <option value="Degree">Degree</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filter">Filter</label>
                <select id="filter" name="filter">
                  <option value="all" selected>All</option>
                  <option value="failed">failed</option>

                </select>
              </div>
              <div class="table-1">
                <table id="targetTable">
                  </table>
              </div>
        </form>
    </div>

    <form action="" onsubmit="checkSub(event)">
        <label for="age"></label>
        <input type="text" name="age">
        <button type="submit" >submit</button>

    </form>

    
    <script>
        let photoIndex = 0;
        let timerId ;
        let flagOfSliding =1;
        let images =document.querySelectorAll(".images img");
        document.querySelector(".form-1 .stop").addEventListener("click",function(){
                        stopClicked();
                    })

        function slide(){
            flagOfSliding=1;
                clearInterval(timerId);
                timerId = setInterval(()=>{
                    if(flagOfSliding){
                        images[photoIndex].classList.remove("now");
                        photoIndex = (photoIndex + 1) % 3;
                        images[photoIndex].classList.add("now");
                    }

            },2000);
        }
        
        function stopClicked(){
            flagOfSliding=0;
            clearInterval(timerId);
            return true
        }
        
        function nextPhoto(){
            clearInterval(timerId);
            images[photoIndex].classList.remove("now");
            photoIndex = (photoIndex + 1) % 3;
            images[photoIndex].classList.add("now");
        }
        function prevPhoto(){
            clearInterval(timerId);
            images[photoIndex].classList.remove("now");
            photoIndex = (photoIndex - 1 +3 ) % 3;
            images[photoIndex].classList.add("now");
        }
        console.log();

        let tableData=[

                {
                    name:"Eman",
                    degree:0
                }
                ,{
                    name:"Ahmed",
                    degree:90
                },
                {
                    name:"Mona",
                    degree:50
                }
        ]

        
         function emptyHtml(){
            let targetTable = document.getElementById("targetTable");
            targetTable.innerHTML ="";
        }

        function addDataForTheFirstTime(){
            
            emptyHtml();
            let htmlText ="";
            for(let i=0; i< tableData.length; i++){
                htmlText +=
                            `
                                <tr>
                                <td id ="name-${i}">${tableData[i].name}</td>
                                <td id ="degree-${i}" >${tableData[i].degree}</td>
                                <td>
                                    <button type="button" onclick="deleteElement(${i})" id="del-${i}">delete</button>
                                </td>
                                </tr>
                            `       
            }
            let targetTable = document.getElementById("targetTable");
            targetTable.innerHTML =htmlText;
            changeColor()
        }

            
        addDataForTheFirstTime();

        function addElement(inputName,inputDegree){
            tableData.unshift({
                name:inputName,
                degree:inputDegree
            })
            addDataForTheFirstTime();
        }
        // <<<<<<<<<<<<<<<<<<<<<<<<< changing color of table element >>>>>>>>>>>>>>>>>>

        function changeColor(){
            
            for(let i =0; i<tableData.length; i++){
                if(tableData[i].degree <60){
                    document.getElementById(`name-${i}`).style.backgroundColor ="red";
                    document.getElementById(`degree-${i}`).style.backgroundColor ="red";
                    
                }
                if(tableData[i].degree >= 60 && tableData[i].degree <= 75){
                    document.getElementById(`name-${i}`).style.backgroundColor ="yellow";
                    document.getElementById(`degree-${i}`).style.backgroundColor ="yellow";
                }
                if(tableData[i].degree > 75){
                    document.getElementById(`name-${i}`).style.backgroundColor ="green";
                    document.getElementById(`degree-${i}`).style.backgroundColor ="green";
                }
            }
        }
     
        // <<<<<<<<<<<<<<<<<<<<<<<<< changing color of table element >>>>>>>>>>>>>>>>>>


        // <<<<<<<<<<<< check if the value of name exists or not >>>>>>>>>>>>

        function inTable(name){
            for(let i=0; i< tableData.length; i++){
                if(name === tableData[i].name){
                    return true;
                }
            }
            return false;
        }
        function capitalizeFirst(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
        // <<<<<<<<<<<< check if the value of name exists or not >>>>>>>>>>>>


        // <<<<<<<< adding errors of validation to html >>>>>>>>>>>>
        let timerId2=null;
        let errors=[];
        function addErrors(){
            if (timerId2 !== null) {
                clearTimeout(timerId2);
            }
            document.getElementById("errorMassage").innerHTML  = "";
            document.getElementById("errorMassage").style.display = "block";
            console.log(errors);
            
            for(error of errors){
                document.getElementById("errorMassage").innerHTML += `${error}<br>`;
            }
            document.getElementById("errorMassage").style.fontSize ="10px"
            document.getElementById("errorMassage").style.backgroundColor ="red"
            timerId2=setTimeout(()=>{
                document.getElementById("errorMassage").style.display="none";
            },2000 )

        }


         // <<<<<<<< adding errors of validation to html >>>>>>>>>>>>





        function add(event){
            let valueNumber = Number(document.forms[1][4].value); 
            event.preventDefault();
            errors=[];
            if((!(document.forms[1][3].value)) || inTable(capitalizeFirst(document.forms[1][3].value)) || isNaN(document.forms[1][4].value) || !(valueNumber > 0 && valueNumber <= 100)){
                
                if(!(document.forms[1][3].value)) errors.push("Empty StudentName");
                if(inTable(capitalizeFirst(document.forms[1][3].value))) errors.push("The student Exists already");
                if(isNaN(document.forms[1][4].value))  errors.push("Degree must be a number");
                if(!(valueNumber > 0 && valueNumber < 100)) errors.push("Degree must be in between 0 and 100");
                event.preventDefault();
                
                addErrors();
            }
            else{
                addElement(capitalizeFirst(document.forms[1][3].value),document.forms[1][4].value);
            }
        }

        // sorting
        function sortingName(){
            tableData.sort((a, b) => {
            
            let nameA = a.name.toLowerCase();
            let nameB = b.name.toLowerCase();
            
            if (nameA < nameB) {
                return -1;
            }
            if (nameA > nameB) {
                return 1;
            }
            return 0;
            });
            addDataForTheFirstTime();
        }
        function sortingDegree(){
            tableData.sort((a, b) => a.degree - b.degree);
            addDataForTheFirstTime();
        }
        

        const sortSelect = document.getElementById("sort");

        sortSelect.addEventListener("change", function () {
        if (sortSelect.value === "name") {
            sortingName();
        }
        else{
            sortingDegree();
        }
        });


     
        // filter function

        let filtered=[];
        function filter(){
            let filtered=[]
            for(let i=0; i<tableData.length; i++){
                if(tableData[i].degree < 60){
                    filtered.push(tableData[i]);
                }
            }
            addDataFilterd(filtered );
        }

        function addDataFilterd(filtered){
            emptyHtml();
            let htmlText ="";
            for(let i=0; i< filtered.length; i++){
                htmlText +=
                            `
                                <tr>
                                <td id="name-${i}">${filtered[i].name}</td>
                                <td id="degree-${i}">${filtered[i].degree}</td>
                                <td>
                                    <button type="button" onclick="deleteElement(${i})" id="del-${i}">delete</button>
                                </td>
                                </tr>
                            `       
            }
            let targetTable = document.getElementById("targetTable");
            targetTable.innerHTML =htmlText;
            for(let i=0; i<filtered.length; i++){
                document.getElementById(`name-${i}`).style.backgroundColor ="red";
                document.getElementById(`degree-${i}`).style.backgroundColor ="red";
            }

        };
 
        const filterSelect = document.getElementById("filter");

        filterSelect.addEventListener("change", function () {
        if (filterSelect.value === "failed") {
            
            filter();
          
        }
        else{
            emptyHtml();
            addDataForTheFirstTime();
        }
        });

        // delete element from table

        function deleteElement(index){
            for(let i=0;i<tableData.length;i++){
                if(i == index){
                    tableData.splice(i,1);
                }
            }
            addDataForTheFirstTime();
        }
   
   
    </script>
</body>
</html>
